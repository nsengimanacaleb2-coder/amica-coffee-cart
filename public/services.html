<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Cart Services — Amica House</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">Amica<span>House</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">Coffee Carts</a>
      <a href="packages.html">Packages</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html">Gallery</a>
      <a href="faq.html">FAQ</a>
      <a href="index.html#contact">Contact</a>
      <span id="nav-auth-slot" style="display:flex;gap:18px;align-items:center;"></span>
    </div>
  </div>
</nav>

<header class="hero" id="main-content" style="padding:56px 0;">
  <div class="wrap">
    <p class="eyebrow">Coffee Cart Services</p>
    <h1 style="font-size:2.2rem;">Pick the cart that fits your event</h1>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="filters-bar">
      <div class="field">
        <label for="f-price">Max price/day</label>
        <input type="number" id="f-price" placeholder="e.g. 250">
      </div>
      <div class="field">
        <label for="f-capacity">Min capacity</label>
        <input type="number" id="f-capacity" placeholder="e.g. 100">
      </div>
      <div class="field">
        <label for="f-date">Available on date</label>
        <input type="date" id="f-date">
      </div>
      <button class="btn btn-primary btn-sm" id="apply-filters">Apply Filters</button>
      <button class="btn btn-outline btn-sm" id="clear-filters">Clear</button>
    </div>
    <div class="cart-grid" id="cart-grid">
      <!-- filled by script -->
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div>&copy; 2026 Amica House Coffee Cart. All rights reserved.</div>
    <div>hello@amicahouse.com &middot; +250 780 000 000 &middot; Kigali, Rwanda</div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/widgets.js"></script>
<script>
  let allCarts = [];

  function cartCardHtml(cart) {
    return `
      <div class="cart-card">
        <div class="thumb" style="background-image:url('${cart.image || ''}')">${cart.image ? '' : '☕'}</div>
        <div class="body">
          <h3>${cart.cart_name}</h3>
          <p class="desc">${cart.description || ''}</p>
          <ul class="equip-list">
            ${cart.equipment.map((e) => `<li>${e}</li>`).join('')}
          </ul>
          <p style="font-size:0.8rem;opacity:0.7;">Capacity: up to ${cart.capacity || '—'} guests</p>
          <div class="price-row">
            <span class="price-tag">$${Number(cart.price).toFixed(0)}<small>/day</small></span>
            <a href="cart-details.html?id=${cart.id}" class="btn btn-primary btn-sm">Book this cart</a>
          </div>
        </div>
      </div>`;
  }

  function renderCarts(carts) {
    const grid = document.getElementById('cart-grid');
    grid.innerHTML = carts.map(cartCardHtml).join('') || '<p class="empty-state">No coffee carts match your filters.</p>';
  }

  async function loadCarts() {
    try {
      allCarts = await api('/carts');
      renderCarts(allCarts);
    } catch (err) {
      document.getElementById('cart-grid').innerHTML = `<p class="empty-state">Could not load coffee carts: ${err.message}</p>`;
    }
  }

  document.getElementById('apply-filters').addEventListener('click', async () => {
    const maxPrice = parseFloat(document.getElementById('f-price').value);
    const minCapacity = parseFloat(document.getElementById('f-capacity').value);
    const date = document.getElementById('f-date').value;

    let filtered = allCarts.filter((c) => {
      if (!isNaN(maxPrice) && Number(c.price) > maxPrice) return false;
      if (!isNaN(minCapacity) && Number(c.capacity) < minCapacity) return false;
      return true;
    });

    if (date) {
      const grid = document.getElementById('cart-grid');
      grid.innerHTML = '<p class="empty-state">Checking availability…</p>';
      const results = await Promise.all(filtered.map((c) => api(`/carts/${c.id}/availability?date=${date}`).catch(() => ({ available: false }))));
      filtered = filtered.filter((_, i) => results[i].available);
    }

    renderCarts(filtered);
  });

  document.getElementById('clear-filters').addEventListener('click', () => {
    document.getElementById('f-price').value = '';
    document.getElementById('f-capacity').value = '';
    document.getElementById('f-date').value = '';
    renderCarts(allCarts);
  });

  loadCarts();
</script>
</body>
</html>
