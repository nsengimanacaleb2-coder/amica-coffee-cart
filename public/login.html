<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Amica House</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">Amica<span>House</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">Coffee Carts</a>
      <span id="nav-auth-slot" style="display:flex;gap:18px;align-items:center;"></span>
    </div>
  </div>
</nav>

<section>
  <div class="wrap">
    <div class="section-head">
      <p class="eyebrow">Welcome back</p>
      <h2>Log in to your account</h2>
    </div>
    <form class="form-card" id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
      <div id="form-msg" class="form-msg"></div>
      <p style="font-size:0.85rem;text-align:center;margin-top:16px;">No account yet? <a href="register.html" style="color:var(--marigold);font-weight:600;">Create one</a></p>
      <p style="font-size:0.75rem;text-align:center;margin-top:6px;opacity:0.6;">Admin demo login: admin@amicahouse.com / Admin@123</p>
    </form>
  </div>
</section>

<footer>
  <div class="wrap">
    <div>&copy; 2026 Amica House Coffee Cart. All rights reserved.</div>
    <div>hello@amicahouse.com &middot; +250 780 000 000 &middot; Kigali, Rwanda</div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('form-msg');
    msg.className = 'form-msg';
    try {
      const { token, user } = await api('/auth/login', {
        method: 'POST',
        body: {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        },
      });
      setSession(token, user);
      msg.textContent = 'Logged in! Redirecting…';
      msg.className = 'form-msg success';

      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      const target = redirect || (user.role === 'admin' ? 'dashboard-admin.html' : 'dashboard-customer.html');
      setTimeout(() => (window.location.href = target), 500);
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'form-msg error';
    }
  });
</script>
</body>
</html>
